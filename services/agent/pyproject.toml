[project]
name = "voice-agent"
version = "1.0.0"
description = "Realtime LiveKit voice agent for Voice AI"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents[openai]~=1.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
google = ["livekit-agents[google]~=1.0"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
voice-agent = "voice_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
